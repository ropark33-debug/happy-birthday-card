<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Happy Birthday</title>


    <style>
         :root {
            --ink: #922b49;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #101c22;
            font-family: Arial, "Malgun Gothic", sans-serif;
        }
        
        main {
            width: min(900px, 100%);
            text-align: center;
        }
        
        h1 {
            color: white;
            font-size: clamp(24px, 5vw, 42px);
        }
        
        h1 span {
            color: #a8d966;
        }
        
        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            border: 3px solid white;
            border-radius: 8px;
            background: radial-gradient(circle at 65% 60%, #fffde5, transparent 50%), linear-gradient(135deg, #fff1e5, #ffd7c5);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .wish {
            position: absolute;
            left: 5.5%;
            bottom: 10%;
            max-width: 46%;
            z-index: 6;
            color: var(--ink);
            text-align: left;
            pointer-events: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 1s, transform 1s;
        }
        
        .wish.is-in {
            opacity: 1;
            transform: translateY(0);
        }
        
        .wish p {
            margin: 0 0 8px;
            font-size: clamp(12px, 2vw, 18px);
        }
        
        .wish h2 {
            margin: 0;
            font-family: Georgia, serif;
            font-style: italic;
            font-size: clamp(24px, 5vw, 48px);
        }
        
        button {
            margin-top: 20px;
            padding: 12px 24px;
            border: 0;
            border-radius: 24px;
            background: #a8d966;
            color: #142019;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            background: #bce789;
        }
    </style>
</head>

<body>

    <main>

        <h1>Interactive <span>Birthday Gift</span></h1>


        <div class="card">
            <canvas id="canvas" aria-label="하트가 피어나는 생일 나무"></canvas>

            <div class="wish" id="wish">

                <p>오늘 하루, 행복으로 가득하길!</p>

                <h2>Happy Birthday</h2>
            </div>
        </div>

        <button id="startButton" type="button">선물 열기 🎁</button>
    </main>


    <script>
        const canvas = document.getElementById("canvas");    
        const ctx = canvas.getContext("2d");    
        const wish = document.getElementById("wish");    
        const startButton = document.getElementById("startButton");

             // 그림은 이 기준 좌표로 만들고 화면 크기에 맞춰 확대합니다.
            
        const WIDTH = 900;    
        const HEIGHT = 560;

            
        const branches = [];    
        const hearts = [];    
        const colors = ["#e85b80", "#f07898", "#d94370", "#ff9bb2"];

            
        let startedAt = null;    
        let frameId = null;

             // 같은 모양의 나무를 만들기 위한 간단한 난수 함수입니다.
            
        let seed = 12;

            
        function random() {      
            seed = (seed * 16807) % 2147483647;      
            return (seed - 1) / 2147483646;    
        }

            
        function createBranch(x, y, length, angle, width, depth, start) {      
            const endX = x + Math.cos(angle) * length;      
            const endY = y + Math.sin(angle) * length;

                  
            branches.push({        
                x,
                y,
                endX,
                endY,
                width,
                        start,
                        duration: 480      
            });

                  
            if (depth <= 0) return;

                  
            const nextStart = start + 350;

                  
            createBranch(        endX, endY,         length * (0.68 + random() * 0.08),         angle - (0.3 + random() * 0.28),         width * 0.7,         depth - 1,         nextStart      );

                  
            createBranch(        endX, endY,         length * (0.68 + random() * 0.08),         angle + (0.3 + random() * 0.28),         width * 0.7,         depth - 1,         nextStart      );    
        }

            
        createBranch(      590, HEIGHT + 5,       155, -Math.PI / 2,       19, 5, 0    );

             // ハート形の領域に小さなハートを配置します。
             // 아래 수식은 하트 모양의 내부인지 판별합니다.
            
        while (hearts.length < 230) {      
            const x = random() * 2.4 - 1.2;      
            const y = random() * 2.4 - 1.2;

                  
            const inside =         Math.pow(x * x + y * y - 1, 3)         - x * x * Math.pow(y, 3) <= 0;

                  
            if (!inside) continue;

                  
            hearts.push({        
                x: 590 + x * 155,
                        y: 210 - y * 140,
                        size: 5 + random() * 8,
                        delay: 2200 + random() * 1600,
                        phase: random() * Math.PI * 2,
                        color: colors[Math.floor(random() * colors.length)]      
            });    
        }

            
        function drawHeart(x, y, size, color, alpha) {      
            ctx.save();      
            ctx.translate(x, y);      
            ctx.scale(size, size);      
            ctx.globalAlpha = alpha;      
            ctx.fillStyle = color;

                  
            ctx.beginPath();      
            ctx.moveTo(0, 0.8);      
            ctx.bezierCurveTo(-1.6, -0.2, -0.8, -1.3, 0, -0.5);      
            ctx.bezierCurveTo(0.8, -1.3, 1.6, -0.2, 0, 0.8);      
            ctx.fill();

                  
            ctx.restore();    
        }

            
        function draw(elapsed) {      
            ctx.clearRect(0, 0, WIDTH, HEIGHT);

                  
            ctx.strokeStyle = "#70414a";      
            ctx.lineCap = "round";

                  
            for (const branch of branches) {        
                const progress = Math.max(          0,           Math.min(1, (elapsed - branch.start) / branch.duration)        );

                        
                if (progress === 0) continue;

                        
                ctx.lineWidth = branch.width;        
                ctx.beginPath();        
                ctx.moveTo(branch.x, branch.y);        
                ctx.lineTo(          branch.x + (branch.endX - branch.x) * progress,           branch.y + (branch.endY - branch.y) * progress        );        
                ctx.stroke();      
            }

                  
            for (const heart of hearts) {        
                const progress = Math.max(          0,           Math.min(1, (elapsed - heart.delay) / 700)        );

                        
                if (progress === 0) continue;

                        
                const sway = Math.sin(elapsed / 900 + heart.phase) * 2;

                        
                drawHeart(          heart.x + sway,           heart.y,           heart.size * progress,           heart.color,           progress        );      
            }

                  
            if (elapsed >= 2800) {        
                wish.classList.add("is-in");      
            }    
        }

            
        function animate(timestamp) {      
            if (startedAt === null) startedAt = timestamp;

                  
            draw(timestamp - startedAt);      
            frameId = requestAnimationFrame(animate);    
        }

            
        function resizeCanvas() {      
            const rect = canvas.getBoundingClientRect();      
            const ratio = window.devicePixelRatio || 1;

                  
            canvas.width = Math.round(rect.width * ratio);      
            canvas.height = Math.round(rect.height * ratio);

                  
            ctx.setTransform(        canvas.width / WIDTH, 0,         0, canvas.height / HEIGHT,         0, 0      );

                  
            if (startedAt === null) draw(0);    
        }

            
        function start() {      
            if (frameId !== null) cancelAnimationFrame(frameId);

                  
            startedAt = null;      
            wish.classList.remove("is-in");      
            startButton.textContent = "다시 보기 🎂";      
            frameId = requestAnimationFrame(animate);    
        }

            
        window.addEventListener("resize", resizeCanvas);    
        startButton.addEventListener("click", start);

            
        resizeCanvas();
        startButton.click();
    </script>
</body>

</html>
